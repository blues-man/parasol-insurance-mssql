apiVersion: v1
kind: Service
metadata:
  name: {{ include "parasol.mssqlName" . }}
  labels:
    {{- include "parasol.mssqlLabels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "parasol.mssqlName" . }}
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
  type: {{ .Values.mssql.serviceType }}
